<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSC426 Practical Works</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0d2447 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    h1 {
      color: #e8f4fd;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(100,180,255,0.4);
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(100,180,255,0.25);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .card-title {
      color: #64b4ff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(100,180,255,0.3);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    /* ===== CALCULATOR ===== */
    #display {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(100,180,255,0.2);
      border-radius: 10px;
      color: #e8f4fd;
      font-size: 2rem;
      text-align: right;
      padding: 14px 16px;
      margin-bottom: 16px;
      word-break: break-all;
      min-height: 60px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(100,180,255,0.2);
      border-radius: 10px;
      color: #e8f4fd;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 0;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: rgba(100,180,255,0.2); transform: scale(1.04); }
    .btn:active { transform: scale(0.97); }

    .btn.op { color: #64b4ff; }
    .btn.clear { background: rgba(220,60,60,0.2); color: #ff7b7b; border-color: rgba(220,60,60,0.3); }
    .btn.equal { background: rgba(30,120,220,0.5); color: #fff; border-color: #3b82f6; grid-column: span 2; }
    .btn.zero { grid-column: span 1; }

    /* ===== LOGIN ===== */
    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      color: #a0c8f0;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(100,180,255,0.25);
      border-radius: 8px;
      color: #e8f4fd;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input::placeholder { color: rgba(200,220,255,0.35); }
    .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .form-group input.error { border-color: #f87171; }

    .error-msg {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 4px;
      display: none;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .btn-login {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(100,180,255,0.3);
      border-radius: 8px;
      color: #a0c8f0;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-reset:hover { background: rgba(100,180,255,0.1); }

    .alert {
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 14px;
      margin-top: 14px;
      display: none;
    }
    .alert.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #86efac; }
    .alert.fail    { background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.4);  color: #fca5a5; }
  </style>
</head>
<body>

<h1>CSC426 Practical Works</h1>

<div class="container">

  <!-- TASK 1: CALCULATOR -->
  <div class="card">
    <div class="card-title">Task 1 — Calculator</div>
    <div id="display">0</div>
    <div class="calc-grid">
      <button class="btn clear"   onclick="calcClear()">C</button>
      <button class="btn op"      onclick="calcInput('%')">%</button>
      <button class="btn op"      onclick="calcInput('^')">^</button>
      <button class="btn op"      onclick="calcInput('÷')">÷</button>

      <button class="btn"         onclick="calcInput('7')">7</button>
      <button class="btn"         onclick="calcInput('8')">8</button>
      <button class="btn"         onclick="calcInput('9')">9</button>
      <button class="btn op"      onclick="calcInput('×')">×</button>

      <button class="btn"         onclick="calcInput('4')">4</button>
      <button class="btn"         onclick="calcInput('5')">5</button>
      <button class="btn"         onclick="calcInput('6')">6</button>
      <button class="btn op"      onclick="calcInput('-')">−</button>

      <button class="btn"         onclick="calcInput('1')">1</button>
      <button class="btn"         onclick="calcInput('2')">2</button>
      <button class="btn"         onclick="calcInput('3')">3</button>
      <button class="btn op"      onclick="calcInput('+')">+</button>

      <button class="btn zero"    onclick="calcInput('0')">0</button>
      <button class="btn"         onclick="calcInput('.')">.</button>
      <button class="btn equal"   onclick="calcEquals()">=</button>
    </div>
  </div>

  <!-- TASK 2: LOGIN -->
  <div class="card">
    <div class="card-title">Task 2 — Login</div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" oninput="clearErrors()"/>
      <div class="error-msg" id="err-user">Username is required.</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" oninput="clearErrors()"/>
      <div class="error-msg" id="err-pass">Password must be at least 6 characters.</div>
    </div>

    <div class="btn-row">
      <button class="btn-login" onclick="doLogin()">Login</button>
      <button class="btn-reset" onclick="doReset()">Reset</button>
    </div>

    <div class="alert success" id="alert-ok">✓ Login successful! Welcome back.</div>
    <div class="alert fail"    id="alert-fail">✗ Invalid credentials. Please try again.</div>
  </div>

</div>

<script>
  // ======= CALCULATOR =======
  let expr = '';

  function calcInput(val) {
    const display = document.getElementById('display');
    if (display.textContent === '0' && val !== '.') expr = '';
    expr += val;
    display.textContent = expr;
  }

  function calcClear() {
    expr = '';
    document.getElementById('display').textContent = '0';
  }

  function calcEquals() {
    try {
      let e = expr
        .replace(/÷/g, '/')
        .replace(/×/g, '*')
        .replace(/(\d+(\.\d+)?)\^(\d+(\.\d+)?)/g, 'Math.pow($1,$3)');
      let result = Function('"use strict"; return (' + e + ')')();
      result = parseFloat(result.toFixed(10));
      document.getElementById('display').textContent = result;
      expr = String(result);
    } catch {
      document.getElementById('display').textContent = 'Error';
      expr = '';
    }
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') calcInput(e.key);
    else if (e.key === '+') calcInput('+');
    else if (e.key === '-') calcInput('-');
    else if (e.key === '*') calcInput('×');
    else if (e.key === '/') { e.preventDefault(); calcInput('÷'); }
    else if (e.key === '%') calcInput('%');
    else if (e.key === '^') calcInput('^');
    else if (e.key === '.') calcInput('.');
    else if (e.key === 'Enter' || e.key === '=') calcEquals();
    else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') calcClear();
    else if (e.key === 'Backspace') {
      expr = expr.slice(0, -1);
      document.getElementById('display').textContent = expr || '0';
    }
  });

  // ======= LOGIN =======
  // Demo credentials
  const VALID_USER = 'admin';
  const VALID_PASS = 'password123';

  function doLogin() {
    let valid = true;
    const u = document.getElementById('username');
    const p = document.getElementById('password');
    const eu = document.getElementById('err-user');
    const ep = document.getElementById('err-pass');

    if (!u.value.trim()) {
      u.classList.add('error'); eu.style.display = 'block'; valid = false;
    }
    if (p.value.length < 6) {
      p.classList.add('error'); ep.style.display = 'block'; valid = false;
    }

    if (!valid) return;

    const ok = document.getElementById('alert-ok');
    const fail = document.getElementById('alert-fail');
    ok.style.display = 'none'; fail.style.display = 'none';

    if (u.value.trim() === VALID_USER && p.value === VALID_PASS) {
      ok.style.display = 'block';
    } else {
      fail.style.display = 'block';
    }
  }

  function doReset() {
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    clearErrors();
    document.getElementById('alert-ok').style.display = 'none';
    document.getElementById('alert-fail').style.display = 'none';
  }

  function clearErrors() {
    ['username','password'].forEach(id => document.getElementById(id).classList.remove('error'));
    document.getElementById('err-user').style.display = 'none';
    document.getElementById('err-pass').style.display = 'none';
  }
</script>

</body>
</html>
